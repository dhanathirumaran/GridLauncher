name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run gradle tests
      run: ./gradlew test -PversionCode=${{ github.run_number }} -PversionName=1.0.0-build-${{ github.run_number }}

    - name: Build Release APK (R8 Optimized)
      run: |
        ./gradlew assembleRelease -PversionCode=${{ github.run_number }} -PversionName=1.0.0-build-${{ github.run_number }}
        cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/GridLauncher-v1.0.0-build-${{ github.run_number }}-release.apk || true

    - name: Upload Release APK & Mapping
      uses: actions/upload-artifact@v4
      with:
        name: GridLauncher-release
        path: |
          app/build/outputs/apk/release/*.apk
          app/build/outputs/mapping/release/mapping.txt

    - name: Create GitHub Release (on develop or main tags)
      if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: 'v1.0.0-build-${{ github.run_number }}'
        name: 'GridLauncher Build ${{ github.run_number }}'
        generate_release_notes: true
        prerelease: true
        files: |
          app/build/outputs/apk/release/*.apk
          app/build/outputs/mapping/release/mapping.txt
